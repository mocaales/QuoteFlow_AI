server {
 listen 80;
 root /usr/share/nginx/html;
 server_tokens off;
 client_max_body_size 256k;
 add_header X-Frame-Options "DENY" always;
 add_header X-Content-Type-Options "nosniff" always;
 add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;
 # No add_header in locations: it would drop the server-level ones. Caching uses expires instead.
 location /api/ {
  proxy_pass http://backend:8000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Referrer-Policy;
 }
 location /assets/ { expires 1y; try_files $uri =404; }
 location = /index.html { expires -1; }
 location / { expires -1; try_files $uri $uri/ /index.html; }
}
