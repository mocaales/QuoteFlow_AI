services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PROJECT_REF: ${SUPABASE_PROJECT_REF:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-${SUPABASE_URL:-}}
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
